server:
  port: 8080

spring:
  application:
    name: sistema-restaurante

  datasource:
    url: jdbc:postgresql://localhost:5432/restaurante_db
    username: restaurante_user
    password: restaurante_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo crea Flyway (ver backend/src/main/resources/db/migration
      # y la carpeta /sql para ejecutarlo manualmente). Hibernate NUNCA debe
      # alterar el esquema en este proyecto -> validate.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Guatemala

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:cambiar_correo@gmail.com}
    password: ${MAIL_PASSWORD:cambiar_password_app}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

app:
  jwt:
    secret: ${JWT_SECRET:4M7xRzK9wB2vP6qL1hN5tY8mX3jC0fV4sD7gK9wB2vP6}
    expiration-ms: 28800000   # 8 horas (RN01 / CU01)
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:4200}
  seguridad:
    max-intentos-fallidos: 5
  reset-password:
    expiracion-minutos: 30
  menu:
    # CU12: archivo PDF que ve el Cliente al escanear el QR de su mesa.
    pdf-path: ${MENU_PDF_PATH:./data/menu/menu-actual.pdf}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    com.restaurante: DEBUG
    org.springframework.security: INFO
