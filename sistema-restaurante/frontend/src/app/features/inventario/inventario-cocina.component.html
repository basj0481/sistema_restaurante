<div class="encabezado">
  <h2>Inventario</h2>
  <div style="display:flex; gap:8px;">
    <button class="btn btn-secundario" (click)="mostrarEntrada()">+ Registrar Entrada</button>
    <button class="btn btn-primario" (click)="mostrarNuevo()">+ Nuevo Insumo</button>
  </div>
</div>

<div class="mensaje-error" *ngIf="error()">{{ error() }}</div>
<div class="mensaje-exito" *ngIf="mensaje()">{{ mensaje() }}</div>

<div class="card" style="margin-bottom:20px;" *ngIf="accion() === 'ENTRADA'">
  <h3>Registrar Entrada de Insumo</h3>
  <form (ngSubmit)="guardarEntrada()">
    <div class="form-campo">
      <label>Insumo</label>
      <select name="insumo" [(ngModel)]="entradaInsumoId" required>
        <option [ngValue]="null" disabled>Seleccione un insumo...</option>
        <option *ngFor="let i of insumos()" [ngValue]="i.id">{{ i.nombre }} ({{ i.unidadMedida }})</option>
      </select>
    </div>
    <div class="form-campo">
      <label>Cantidad a ingresar</label>
      <input type="number" step="0.001" name="cantidad" [(ngModel)]="entradaCantidad" required />
    </div>
    <div class="form-campo">
      <label>Motivo / Proveedor (opcional)</label>
      <input type="text" name="motivo" [(ngModel)]="entradaMotivo" />
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primario" type="submit" [disabled]="cargando()">Guardar</button>
      <button class="btn btn-secundario" type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>

<div class="card" style="margin-bottom:20px;" *ngIf="accion() === 'NUEVO'">
  <h3>Crear Nuevo Insumo</h3>
  <form (ngSubmit)="guardarNuevoInsumo()">
    <div class="form-campo">
      <label>Nombre del insumo</label>
      <input type="text" name="nombre" [(ngModel)]="nuevoNombre" required />
    </div>
    <div class="form-campo">
      <label>Unidad de medida</label>
      <input type="text" name="unidad" [(ngModel)]="nuevaUnidad" placeholder="kg, litro, unidad..." required />
    </div>
    <div class="form-campo">
      <label>Stock inicial</label>
      <input type="number" step="0.001" name="stockInicial" [(ngModel)]="nuevoStockInicial" required />
    </div>
    <div class="form-campo">
      <label>Stock mínimo</label>
      <input type="number" step="0.001" name="stockMinimo" [(ngModel)]="nuevoStockMinimo" required />
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primario" type="submit" [disabled]="cargando()">Guardar</button>
      <button class="btn btn-secundario" type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>

<div class="card">
  <table class="tabla">
    <thead>
      <tr><th>Nombre</th><th>Unidad</th><th>Stock actual</th><th>Stock mínimo</th><th>Estado</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let i of insumos()">
        <td>{{ i.nombre }}</td>
        <td>{{ i.unidadMedida }}</td>
        <td>{{ i.stockActual }}</td>
        <td>{{ i.stockMinimo }}</td>
        <td>
          <span class="badge" [class.badge-rojo]="i.stockBajo" [class.badge-verde]="!i.stockBajo">
            {{ i.stockBajo ? 'Stock Bajo' : 'Normal' }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
